<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbBrainGradPrimary" x1="4" y1="6" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="sbCapGrad" x1="8" y1="4" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="sbSparkGrad" x1="24" y1="2" x2="46" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="sbLogoGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4F46E5" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Dark circular background badge for clean contrast on both light and dark browser tabs -->
  <rect width="48" height="48" rx="12" fill="#0B132B" />
  
  <g filter="url(#sbLogoGlow)">
    <!-- Left Knowledge Hemisphere -->
    <path d="M 24 38 C 17 38 10 33 8 26 C 7 22.5 8 19 10.5 16.5 C 12.5 14.5 15.5 14 18 15 C 20 12 23 11 24 11" stroke="url(#sbBrainGradPrimary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Knowledge Hemisphere -->
    <path d="M 24 38 C 31 38 38 33 40 26 C 41 22.5 40 19 37.5 16.5 C 35.5 14.5 32.5 14 30 15 C 28 12 25 11 24 11" stroke="url(#sbBrainGradPrimary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Central Cortex -->
    <path d="M 24 13 L 24 38" stroke="url(#sbBrainGradPrimary)" stroke-width="2.6" stroke-linecap="round" />

    <!-- Neural Synapses -->
    <path d="M 12 24 C 15 23 18 25 24 25" stroke="url(#sbBrainGradPrimary)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    <path d="M 36 24 C 33 23 30 25 24 25" stroke="url(#sbBrainGradPrimary)" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <!-- Mortarboard Diamond Crown -->
    <path d="M 24 5 L 40 13 L 24 21 L 8 13 Z" fill="url(#sbCapGrad)" />
    <path d="M 15 16.5 L 15 20.5 C 15 23.5 19 25 24 25 C 29 25 33 23.5 33 20.5 L 33 16.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />

    <!-- Golden Tassel & Spark -->
    <path d="M 24 13 C 30 13.5 35.5 16.5 37 21.5 L 37 27" stroke="url(#sbSparkGrad)" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="37" cy="28" r="1.8" fill="#F59E0B" />
    <circle cx="24" cy="13" r="2" fill="#FFFFFF" />
  </g>
</svg>