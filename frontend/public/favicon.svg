<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- UIU Signature Orange to Golden Amber Gradient -->
    <linearGradient id="uiuBrandGrad" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F26522" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <!-- Emerald Accent Gradient for Tassel & Knowledge Spark -->
    <linearGradient id="uiuEmeraldGrad" x1="28" y1="12" x2="40" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="uiuGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#F26522" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Obsidian slate badge for contrast -->
  <rect width="48" height="48" rx="12" fill="#0C1017" />
  
  <g filter="url(#uiuGlow)">
    <!-- 1. Mortarboard Cap Diamond -->
    <path d="M 24 5 L 41 13 L 24 20 L 7 13 Z" stroke="url(#uiuBrandGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 15 16.5 L 15 20 C 15 22.5 19 24.5 24 24.5 C 29 24.5 33 22.5 33 20 L 33 16.5" stroke="url(#uiuBrandGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- 2. Emerald Tassel Accent -->
    <path d="M 33 17 L 37 21 L 37 26" stroke="url(#uiuEmeraldGrad)" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="37" cy="27" r="1.8" fill="#10B981" />

    <!-- 3. Human Brain Neural Cortex Center -->
    <!-- Left Lobe -->
    <path d="M 24 21 C 18 21 14 24 14 28 C 14 31 17 33 20 33 C 18 35 18 38 21 39 C 23 39.5 24 38 24 37" stroke="url(#uiuBrandGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <!-- Right Lobe -->
    <path d="M 24 21 C 30 21 34 24 34 28 C 34 31 31 33 28 33 C 30 35 30 38 27 39 C 25 39.5 24 38 24 37" stroke="url(#uiuBrandGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <!-- Center Cortex Spine -->
    <path d="M 24 22 L 24 38" stroke="url(#uiuBrandGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- 4. Open Book Base -->
    <path d="M 10 33 L 10 41 C 17 41 21 43.5 24 44.5 C 27 43.5 31 41 38 41 L 38 33" stroke="url(#uiuBrandGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 14 36 C 18 36 21 38 24 39.5 C 27 38 30 36 34 36" stroke="url(#uiuBrandGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>